<!doctype html>
<html lang="en">
  <head>

    <meta

      content="width=device-width, initial-scale=1.0"

    <link

    <link

  <body>
    <header>

        <button class="b2">
          Order Online <i class="fa-solid fa-circle-arrow-right"></i>

      <h1>Restaurants! Our Brands</h1>

        Please click our brands below for further information, reservations or

      <div class="welcomeBox">
        <div class="welDiv2">

            <img

        </div>
        <div class="welDiv2">
          <div class="welImg">
            <img
              src="https://static.tossdown.com/site/9d9cb355-ac8c-404e-a608-c28242343cd1.webp"

          </div>
          <button>order now</button>
        </div>
        <div class="welDiv2">
          <div class="welImg">

            <img
              src="https://static.tossdown.com/site/f9238d0e-7c34-4139-a081-c57b7713628e.webp"
              alt=""
            />
          </div>
          <button>reserve table</button>
        </div>
        <div class="welDiv2">
          <div class="welImg">

            <img src="https://static.tossdown.com/images/38f64422-c79a-4650-8df2-5668743154df.webp" alt="">
          </div>
          <button>order now</button>
        </div>
      </div>
